name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: penink-vpn-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 若要 CI 自動部署到 Cloudflare Pages，請在 GitHub Secrets 加入：
      #   CLOUDFLARE_API_TOKEN : 在 Cloudflare 建立 token（Permissions: Pages Edit）
      #   CLOUDFLARE_ACCOUNT_ID : 25b92ebf1d8eb315d4bf1d0bdce3b037
      # 然後取消下方註解：
      # - uses: cloudflare/pages-action@v1
      #   with:
      #     command: deploy web --project-name penink-vpn --commit-dirty=true
      #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     directory: web