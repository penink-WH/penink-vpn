services:
  penink-vpn:
    image: penink-vpn-server
    container_name: penink-vpn
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
    ports:
      - "9543:9543"          # Mac/主機能用 localhost:9543 存取
    environment:
      PASSWORD: "${PASSWORD:-CHANGE_ME}"   # 在 .env 設定你的密鑰
      WS_PORT: "9543"
      TUN_ADDR: "10.27.0.1/24"
    volumes:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - seccomp:unconfined